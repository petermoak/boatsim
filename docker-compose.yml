# Portainer stack (Stacks -> Add stack -> Repository, compose path docker-compose.yml).
#
# Signal K runs on the existing Docker network "serendipity" without publishing the
# injector port, so boatsim joins that network and reaches Signal K by container name.
# Override in the Portainer stack's environment variables if names differ:
#   SIGNALK_HOST    - Signal K container name (default: signalk)
#   DOCKER_NETWORK  - shared network name     (default: serendipity)
services:
  boatsim:
    build: .
    image: boatsim:latest
    container_name: boatsim
    restart: unless-stopped
    ports:
      - "5010:5010"
    environment:
      SIGNALK_HOST: ${SIGNALK_HOST:-signalk}
      SIGNALK_INJECTOR_PORT: ${SIGNALK_INJECTOR_PORT:-10112}
      # Set to "false" to start with output disabled (toggle in the UI).
      SIGNALK_AUTOCONNECT: ${SIGNALK_AUTOCONNECT:-true}
    volumes:
      - boatsim-data:/data
    networks:
      - signalk-net

networks:
  signalk-net:
    name: ${DOCKER_NETWORK:-serendipity}
    external: true

volumes:
  boatsim-data:
